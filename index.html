<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dünen &amp; Dinare – Karawanenhandel in der Wüste</title>
<!-- Schriften liegen im Ordner fonts/ (siehe style.css) – keine Verbindung zu Google -->
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#10142b">
</head>
<body>

<header>
  <h1>Dünen &amp; Dinare</h1>
  <div class="anzeige">
    <span class="kasten k-tag wert" id="anzeigeTag"></span>
    <span class="kasten k-uhr wert" id="anzeigeUhr"></span>
    <span class="kasten k-jahr" id="anzeigeJahreszeit"></span>
    <span class="kasten k-gold"><span class="wert" id="anzeigeGold"></span> 🪙</span>
    <span class="kasten k-rang" id="rangKasten">🏅 <span class="wert" id="anzeigeRang"></span></span>
    <span class="wert minus" id="anzeigeSchulden"></span>
  </div>
  <div class="knoepfe">
  <button id="btnStatistik">📊 Statistik</button>
  <button id="btnPause">⏸ Pause</button>
  <button data-tempo="0.5">0,5×</button>
  <button data-tempo="1">1×</button>
  <button data-tempo="1.5">1,5×</button>
  <button data-tempo="3">3×</button>
  <button data-tempo="5">5×</button>
  <button id="btnSprache" class="flaggen-knopf"></button>
  <button id="btnMusik" title="Musik an/aus">🎵</button>
  <button id="btnTon" title="Ton an/aus">🔊</button>
  <button id="btnMenue">☰ Menü</button>
  </div>
</header>

<div id="haupt">
  <div id="links">
    <div id="kartenRahmen">
      <canvas id="karte" width="1350" height="700"></canvas>
      <div class="zoomKnoepfe">
        <span id="zoomStufe"></span>
        <button id="btnZoomRein" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
        <button id="btnZoomRaus" title="Herauszoomen" aria-label="Herauszoomen">−</button>
        <button id="btnZoomGanz" title="Ganze Karte" aria-label="Ganze Karte zeigen">⤢</button>
      </div>
    </div>
    <button id="ticker" type="button"></button>
    <div id="logUnten"></div>
  </div>
  <div id="seite">
    <div id="panelTipp"></div>
    <nav id="reiter"></nav>
    <div class="box" id="panelOase"></div>
    <div class="box" id="panelKarawanen"></div>
    <div class="box" id="panelAuftraege"></div>
    <div class="box" id="panelZiele"></div>
    <div class="box" id="panelHaeuser"></div>
    <div class="box" id="logKasten"><h2 id="logTitel">Ereignisse</h2><div id="log"></div></div>
  </div>
</div>

<div id="startseite"><canvas id="startHimmel"></canvas><div class="start-inhalt" id="startInhalt"></div></div>
<div id="statistik"></div>
<div id="menue"></div>

<!-- Die Spiel-Logik, aufgeteilt nach Themen. Die Reihenfolge ist wichtig:
     spätere Dateien benutzen Dinge, die in früheren angelegt werden. -->
<script src="js/00-sprache.js"></script>
<script src="js/00-symbole.js"></script>
<script src="js/01-grunddaten.js"></script>
<script src="js/02-hilfsfunktionen.js"></script>
<script src="js/03-wirtschaft.js"></script>
<script src="js/04-spielstand.js"></script>
<script src="js/05-tageswechsel.js"></script>
<script src="js/06-zufallsereignisse.js"></script>
<script src="js/07-raeuber-auftraege.js"></script>
<script src="js/08-finanzen.js"></script>
<script src="js/09-lebendige-wueste.js"></script>
<script src="js/10-ziele-statistik.js"></script>
<script src="js/11-menue-einfuehrung.js"></script>
<script src="js/12-jahreszeiten-ton.js"></script>
<script src="js/13-kueste-diplomatie.js"></script>
<script src="js/14-bewegung.js"></script>
<script src="js/15-aktionen.js"></script>
<script src="js/16-gebaeude-routen.js"></script>
<script src="js/17-seitenleiste.js"></script>
<script src="js/18-karte.js"></script>
<script src="js/19-abenteuer.js"></script>
<script src="js/20-soeldner.js"></script>
<script src="js/22-pluenderer.js"></script>
<script src="js/23-errungenschaften.js"></script>
<script src="js/24-sieg.js"></script>
<script src="js/25-musik.js"></script>
<script src="js/26-effekte.js"></script>
<script src="js/27-zufallskarte.js"></script>
<script src="js/28-talente-ausruestung.js"></script>
<script src="js/29-entscheidungen.js"></script>
<script src="js/30-berater.js"></script>
<script src="js/31-hilfe-tasten.js"></script>
<script src="js/21-steuerung.js"></script>   <!-- startet das Spiel, darum als Letztes -->
</body>
</html>
